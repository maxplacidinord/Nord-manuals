name: Collect NORD BU manuals
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Check NORD connectivity
        run: |
          python - <<'PY'
          import requests
          url = "https://www.nord.com/en/services/documentation/manuals/manuals.jsp"
          try:
              r = requests.get(url, timeout=30)
              print("NORD status:", r.status_code, "HTML bytes:", len(r.content), "final URL:", r.url)
              print("HTML preview:", r.text[:400])
          except Exception as exc:
              print("NORD connection error:", repr(exc))
          PY
      - name: Collect manuals
        id: collect
        continue-on-error: true
        run: python -u scripts/collect.py 2>&1 | tee collection.log; exit ${PIPESTATUS[0]}
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: |
            collection.log
            manifest.csv
          if-no-files-found: warn
      - name: Commit verified downloads
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A manuals manifest.csv
          git diff --cached --quiet || (git commit -m "Archive verified NORD BU PDFs" && git push)
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Manual collection failed. Download the collection-diagnostics artifact to inspect the reason."
          exit 1
